[project]
name = "lapzero"
version = "0.1.0"
description = "AI race driver trained in the F1TENTH Gym simulator, with a CI release gate."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "f1tenth-gym",
    "fastapi>=0.143.0",
    "gymnasium>=0.29.1",
    "mlflow-skinny>=3.17.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pygame>=2.5.2,<3",
    "sqlalchemy>=2.1.4",
    "stable-baselines3>=2.9.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
# Installs lapzero into the venv (editable) so scripts/ can import it, as CLAUDE.md section 3 expects.
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lapzero"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: slow tests that start the real simulator, a database, or the release gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff also formats code blocks in Markdown; the binding contract doc must never be rewritten
# by tooling.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
# f1tenth_gym ships no type information (no py.typed marker).
module = ["f1tenth_gym", "f1tenth_gym.*"]
ignore_missing_imports = true

[tool.uv.sources]
f1tenth-gym = { git = "https://github.com/f1tenth/f1tenth_gym", rev = "5a301bd0ae1ceaf7dec653e7549c8d099db58a6b" }
